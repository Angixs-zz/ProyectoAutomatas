services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autotask}
      POSTGRES_USER: ${POSTGRES_USER:-autotask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotask_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      PORT: 8080
      # Se deriva de POSTGRES_* para no quedar desincronizada si cambian las credenciales.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-autotask}:${POSTGRES_PASSWORD:-autotask_dev}@postgres:5432/${POSTGRES_DB:-autotask}}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-autotask}
      PGPASSWORD: ${POSTGRES_PASSWORD:-autotask_dev}
      PGDATABASE: ${POSTGRES_DB:-autotask}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      # Mailpit escucha en 1025 dentro de la red; SMTP_PORT solo publica en el host.
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-autotask@localhost}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres_data:
